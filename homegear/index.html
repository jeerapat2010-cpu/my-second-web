  y=pad+30;lines.forEach(([l,font,k])=>{c.font=font;c.fillStyle=k==='h'?'#C62828':'#12222B';c.fillText(l,pad,y);y+=46});
  $('#fpng').onclick=()=>cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='emergency-card.png';a.click()});
  $('#fprint').onclick=()=>printHTML(`<h2>บัตรฉุกเฉินครอบครัว</h2><img src="${cv.toDataURL()}" style="max-width:100%;filter:none">`);
}
function printHTML(h){const pa=$('#printArea');pa.innerHTML=h;document.body.classList.add('printing');const done=()=>{document.body.classList.remove('printing');pa.innerHTML='';window.removeEventListener('afterprint',done)};window.addEventListener('afterprint',done);setTimeout(()=>window.print(),100)}
/* ---------- export ---------- */
function dl(name,text,type){const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800)}
function csv(){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const H=['รหัส','หมวด','รายการ','จำนวน','ราคาต่อหน่วย','รวม','วันที่ซื้อ','ตรวจล่าสุด','รอบตรวจ(วัน)','ครบกำหนดตรวจ','ที่เก็บ','สถานะ','หมายเหตุ'];
  const rows=D.items.map(i=>{const v=inv(i.id),d=dueInfo(i.id);return [i.id,SECS[i.sec].tag.split(' · ')[0],i.name,v.qty,v.unit,v.qty*v.unit,v.buy,v.last,v.iv,d?iso(d.due):'',v.loc,STATUS[v.status],v.note].map(q).join(',')});
  dl('ทะเบียนอุปกรณ์สู้ภัย-'+iso(new Date())+'.csv','\ufeff'+[H.map(q).join(','),...rows].join('\r\n'),'text/csv;charset=utf-8');
}
function ics(){
  const pd=d=>iso(d).replace(/-/g,''),stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const E=[];const ev=(uid,date,sum,desc,rr)=>E.push(['BEGIN:VEVENT','UID:hg-'+uid+'@homegear','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+pd(date),rr?'RRULE:'+rr:'','SUMMARY:'+sum,'DESCRIPTION:'+String(desc).replace(/\n/g,'\\n'),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+sum,'TRIGGER:PT8H','END:VALARM','END:VEVENT'].filter(Boolean).join('\r\n'));
  const nm=new Date();nm.setDate(1);nm.setMonth(nm.getMonth()+1);
  const yr=m=>{const d=new Date();d.setMonth(m-1,1);if(d<todayD())d.setFullYear(d.getFullYear()+1);return d};
  ev('m1',nm,'สู้ภัย: ตรวจอุปกรณ์รายเดือน',D.maint[0].list.join('\n'),'FREQ=MONTHLY;INTERVAL=1');
  ev('m3',nm,'สู้ภัย: ตรวจอุปกรณ์ราย 3 เดือน',D.maint[1].list.join('\n'),'FREQ=MONTHLY;INTERVAL=3');
  ev('m6',nm,'สู้ภัย: ตรวจอุปกรณ์ราย 6 เดือน',D.maint[2].list.join('\n'),'FREQ=MONTHLY;INTERVAL=6');
  ev('y5',yr(5),'สู้ภัย: เตรียมก่อนฤดูฝน',D.maint[3].list.join('\n'),'FREQ=YEARLY');
  ev('y9',yr(9),'สู้ภัย: เตรียมก่อนฤดูน้ำหลาก',D.maint[3].list.join('\n'),'FREQ=YEARLY');
  D.items.forEach(i=>{const d=dueInfo(i.id);if(d&&!d.never&&d.days>=0)ev('i-'+i.id,d.due,'ครบกำหนดตรวจ: '+i.name,'ตรวจตามทะเบียนอุปกรณ์สู้ภัย')});
  dl('เตือนตรวจอุปกรณ์สู้ภัย.ics',['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//HomeGear//TH',...E,'END:VCALENDAR'].join('\r\n'),'text/calendar;charset=utf-8');
  toast('ดาวน์โหลดไฟล์ปฏิทินแล้ว เปิดไฟล์เพื่อเพิ่มลงปฏิทิน');
}
function qrLabels(){
  const locs={};D.items.forEach(i=>{const l=inv(i.id).loc.trim();if(l)(locs[l]=locs[l]||[]).push(i.name)});
  const ks=Object.keys(locs);if(!ks.length){toast('ยังไม่ได้ใส่ "ที่เก็บ" ในรายการ');return}
  const base=location.href.split('#')[0];
  const lab=ks.map(k=>{const q=qrcode(0,'M');q.addData(base+'#inv/loc/'+encodeURIComponent(k));q.make();return `<div class="qrl">${q.createSvgTag(4,2)}<b>${esc(k)}</b><small>${locs[k].length} รายการ</small></div>`}).join('');
  openOverlay(`<a class="btn sm" data-act="closeov">← ปิด</a><h2 style="margin:12px 0">ป้าย QR กล่อง</h2><p class="sub">สแกนด้วยกล้องมือถือเพื่อเปิดรายการของกล่องนั้น ต้องเปิดแอปที่ติดตั้งไว้แล้วบนมือถือที่สแกน</p><div class="qrgrid">${lab}</div><div class="row" style="margin-top:12px"><button class="btn p" id="qprint">พิมพ์</button></div>`,'');
  $('#qprint').onclick=()=>printHTML(`<div class="qrgrid">${lab}</div>`);
}
async function saveOffline(){
  try{toast('กำลังรวมไฟล์ รอสักครู่…');let t=await (await fetch(location.href.split('#')[0])).text();
    const urls=[...new Set(t.match(/(?:img|fonts)\/[\w.\-]+\.(?:jpg|woff2)/g)||[])];
    for(const u of urls){const b=await (await fetch(u)).blob();const d=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});t=t.split(u).join(d)}
    dl('HomeGear-offline.html',t,'text/html;charset=utf-8');toast('บันทึกไฟล์ออฟไลน์แล้ว');
  }catch(e){toast('บันทึกไม่สำเร็จ ลองขณะมีอินเทอร์เน็ต')}
}
/* ---------- events ---------- */
function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#12222B;color:#fff;padding:10px 16px;border-radius:8px;z-index:200;max-width:88vw;font:600 .9rem var(--f-d)';document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,2600)}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,i=+b.dataset.i,k=+b.dataset.k;
  if(a==='tick'){S.scen[i]=S.scen[i]||[];S.scen[i][k]=!S.scen[i][k];save();route()}
  else if(a==='resetScen'){S.scen[i]=[];save();route()}
  else if(a==='checked'){setInv(b.dataset.id,'last',iso(new Date()));setInv(b.dataset.id,'status','ready');toast('บันทึกวันตรวจแล้ว');route()}
  else if(a==='csv')csv();else if(a==='ics')ics();else if(a==='qr')qrLabels();
  else if(a==='backup')dl('homegear-backup-'+iso(new Date())+'.json',JSON.stringify(S),'application/json');
  else if(a==='tool'){tool(b.dataset.n)}
  else if(a==='closeov'){closeOverlay()}
  else if(a==='ltw')window.__lt.w();else if(a==='ltr')window.__lt.r();else if(a==='lts')window.__lt.s();
  else if(a==='bagtick'){S.bag.checked[i]=!S.bag.checked[i];save();route()}
  else if(a==='bagreset'){S.bag.checked={};save();route()}
  else if(a==='bagw'){const v=prompt?null:null;const w=window.prompt('ใส่น้ำหนักเป็นกก. คั่นด้วยจุลภาค ตามลำดับรายการ (เว้นว่าง = ค่าเดิม)');if(w!==null){w.split(',').forEach((x,j)=>{if(x.trim()!==''&&!isNaN(+x))S.bag.w[j]=+x});save();route()}}
  else if(a==='addmem'){S.fam.members.push({n:'',a:'',c:'',d:'',p:''});save();route()}
  else if(a==='delmem'){S.fam.members.splice(k,1);save();route()}
  else if(a==='addsh'){S.shelters.push({n:'',t:''});save();route()}
  else if(a==='famcard')famCard();
  else if(a==='print')printHTML(view.innerHTML);
  else if(a==='saveoff')saveOffline();
  else if(a==='lockagain'){localStorage.removeItem('hg_ok');sessionStorage.removeItem('hg_ok');location.reload()}
  else if(a==='wipe'){if(window.confirm('ล้างข้อมูลทะเบียน บัตรครอบครัว และการตั้งค่าในเครื่องนี้ทั้งหมด?')){localStorage.removeItem('hg_v1');S=defaults();applySettings();route()}}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.f){const id=t.dataset.id,f=t.dataset.f;let v=t.value;if(['qty','unit','iv'].includes(f))v=Math.max(0,+v||0);setInv(id,f,v)}
  else if(t.dataset.fam){S.fam[t.dataset.fam]=t.value;save()}
  else if(t.dataset.mem!==undefined){S.fam.members[+t.dataset.mem][t.dataset.k]=t.value;save()}
  else if(t.dataset.sh!==undefined){S.shelters[+t.dataset.sh][t.dataset.k]=t.value;save()}
  else if(t.dataset.bag==='body'){S.bag.body=t.value;save()}
});
$('#btnTheme').onclick=()=>{const o=['auto','light','dark','night'],n={auto:'ตามเครื่อง',light:'สว่าง',dark:'มืด',night:'กลางคืน (แดง)'};S.settings.theme=o[(o.indexOf(S.settings.theme)+1)%4];save();applySettings();toast('โหมด: '+n[S.settings.theme])};
$('#btnFont').onclick=()=>{const o=[1,1.15,1.3,.9];S.settings.font=o[(o.indexOf(S.settings.font)+1)%4];save();applySettings()};
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;const b=$('#btnInstall');if(b)b.hidden=false});
document.addEventListener('click',e=>{if(e.target.id==='btnInstall'&&deferredPrompt){deferredPrompt.prompt();deferredPrompt=null;e.target.hidden=true}});
function netState(){const n=$('#net');n.className='st '+(navigator.onLine?'on':'off');n.textContent=navigator.onLine?'ออนไลน์':'ออฟไลน์'}
window.addEventListener('online',netState);window.addEventListener('offline',netState);
/* ---------- lock ---------- */
(function(){
  const ok=()=>{try{return localStorage.getItem('hg_ok')===String(PASS_HASH)||sessionStorage.getItem('hg_ok')===String(PASS_HASH)}catch(e){return false}};
  const start=()=>{$('#lock').hidden=true;$('#app').hidden=false;applySettings();netState();$('#verline').textContent='v'+APP_VER+' · '+APP_DATE;route()};
  if(ok()){start();return}
  applySettings();
  let buf='';const dots=$$('#dots i'),msg=$('#lockmsg');
  $('#pad').innerHTML=[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(k=>`<button data-k="${k}">${k}</button>`).join('');
  $('#pad').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k;msg.textContent='';
    if(k==='⌫')buf=buf.slice(0,-1);else if(k==='✓'){check()}else if(buf.length<4){buf+=k}
    dots.forEach((d,i)=>d.classList.toggle('on',i<buf.length));if(buf.length===4&&k!=='⌫'&&k!=='✓')check()});
  function check(){if(buf.length<4)return;if(cyrb('hg:'+buf)===PASS_HASH){try{($('#remember').checked?localStorage:sessionStorage).setItem('hg_ok',String(PASS_HASH))}catch(e){}start()}else{msg.textContent='รหัสไม่ถูกต้อง';$('#dots').classList.add('shake');setTimeout(()=>$('#dots').classList.remove('shake'),400);buf='';dots.forEach(d=>d.classList.remove('on'))}}
  document.addEventListener('keydown',e=>{if($('#lock').hidden)return;if(/^\d$/.test(e.key)&&buf.length<4){buf+=e.key;dots.forEach((d,i)=>d.classList.toggle('on',i<buf.length));if(buf.length===4)check()}else if(e.key==='Backspace'){buf=buf.slice(0,-1);dots.forEach((d,i)=>d.classList.toggle('on',i<buf.length))}});
})();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
