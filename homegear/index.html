function applyProfile(){if(S._prof>=2)return;const was=S._prof;S._prof=2;if(was){if(S.go&&!S.go.pct)S.go.pct=[25,20];save();return}const g=S.go;if(!g||(!g.pre&&!(+g.pets)&&!(+g.med)&&!Object.keys(g.hz||{}).length)){const d=GO_DEF();S.go=Object.assign({},d,g||{},{n:3,pets:2,med:2,hz:d.hz,body:d.body})}const st=S.stock;if(st&&st.n===4&&st.days===7&&!Object.keys(st.c||{}).length)st.n=3;if(!S.fam.members||!S.fam.members.length)S.fam.members=defaults().fam.members;save()}
function goS(){S.go=Object.assign(GO_DEF(),S.go||{});S.go.hz=S.go.hz||{};S.go.off=S.go.off||{};S.go.on=S.go.on||{};S.go.ov=S.go.ov||{};S.go.c=S.go.c||{};S.go.x=S.go.x||[];S.go.body=S.go.body||[70,70];return S.go}
function goCond(w,g){if(!w||!w.trim())return true;return w.split('|').some(k=>{k=k.trim();if(GO_HZ[k])return !!g.hz[k];if(k==='car')return g.mode==='car';return (+g[k]||0)>0})}
function goQty(r,g){const n=Math.max(1,+g.n||1),d=Math.max(1,+g.days||1);const q=r[4];const m={f:q,p:q*n,pd:q*n*d,d:q*d,water:(+g.wl||0)*n*d,kid:q*g.kids,kidd:q*g.kids*d,inf:q*g.infants,infd:q*g.infants*d,eld:q*g.elders,eldd:q*g.elders*d,pet:q*g.pets,petd:q*g.pets*d,med:q*g.med};return Math.max(0,Math.ceil((m[r[3]]??0)-1e-9))}
function goPlan(){
  const g=goS();const act=[];const optList=[],offList=[];
  GO_ITEMS.forEach(r=>{const fl=(r[9]||'').split(/\s+/);if(!goCond(r[8],g))return;const q=goQty(r,g);if(!q)return;
    const isOpt=fl.includes('opt');const on=isOpt?!!g.on[r[0]]:!g.off[r[0]];
    if(!on){(isOpt?optList:offList).push(r);return}
    act.push({id:r[0],cat:r[1],name:r[2],q,unit:r[5],kg:r[6],L:r[7],fl,note:r[10]})});
  g.x.forEach((x,i)=>act.push({id:'x_'+i,cat:(x.c==null?10:+x.c),name:x.n,q:Math.max(1,+x.q||1),unit:x.u||'ชิ้น',kg:+x.kg||0,L:+x.L||0,fl:[],note:'',custom:i,pinBag:+x.b||0}));
  const bags=[{kg:0,L:0,rows:{}},{kg:0,L:0,rows:{}}];
  const put=(a,b,u)=>{bags[b].rows[a.id]=(bags[b].rows[a.id]||0)+u;if(!a.fl.includes('wear'))bags[b].kg+=a.kg*u;if(!a.fl.includes('ext'))bags[b].L+=a.L*u};
  const rest=[];
  act.forEach(a=>{let f=g.ov[a.id];if(!f&&a.pinBag)f=a.pinBag;if(!f)f=a.fl.includes('pin1')?1:a.fl.includes('pin2')?2:0;
    if(f){put(a,f-1,a.q);return}
    if(a.fl.includes('dup')&&a.q>=2){put(a,0,Math.ceil(a.q/2));put(a,1,Math.floor(a.q/2));return}
    rest.push(a)});
  rest.sort((a,b)=>b.kg-a.kg);
  rest.forEach(a=>{const one=a.fl.includes('one');for(let u=0;u<a.q;u++){const pc=g.pct||[25,25],w0=(+g.body[0]||75)*(+pc[0]||25),w1=(+g.body[1]||75)*(+pc[1]||25);const b=bags[0].kg/w0<=bags[1].kg/w1?0:1;put(a,b,1);if(one)break}});
  return {act,bags,optList,offList,g}
}

  else if(a==='pkwl'){const g=goS();g.wl=+b.dataset.v;save();keepRoute()}
  else if(a==='pktick'){const P=packS();const k=b.dataset.id+'_'+b.dataset.b;if(P.c[k])delete P.c[k];else P.c[k]=1;save();keepRoute()}
  else if(a==='pkall'||a==='pkclr'){const P=packS(),R=pkPlan();const x=R.bags.find(y=>y.id===b.dataset.id);if(x)Object.keys(x.rows).forEach(id=>{if(a==='pkall')P.c[id+'_'+x.id]=1;else delete P.c[id+'_'+x.id]});save();keepRoute()}
  else if(a==='pkfit'){const P=packS();const k=b.dataset.k;if(P.fit[k])delete P.fit[k];else P.fit[k]=1;save();keepRoute()}
  else if(a==='pkgo'){const e=document.getElementById('pkc_'+b.dataset.id);if(e)e.scrollIntoView({behavior:'smooth',block:'start'})}
  else if(a==='pkprint')pkPrint(b.dataset.id);
  else if(a==='pktag')pkTag(b.dataset.id);
  else if(a==='pkdate'){packS().date=iso(new Date());save();toast('บันทึกวันที่จัดเสร็จแล้ว');keepRoute()}
  else if(a==='pkics')pkIcs();
  else if(a==='pkq'){const P=packS();P.q=P.q?0:1;save();keepRoute()}
  else if(a==='pkgrab'){const P=packS();P.bags.forEach(x=>{if(x.id===b.dataset.id)x.grab=x.grab?0:1;else x.grab=0});save();keepRoute()}
  else if(a==='pkadd'){const P=packS();P.bags.push({id:'b'+Date.now().toString(36),n:'กระเป๋าใหม่',l:40,img:'',who:-1});save();keepRoute()}
  else if(a==='pkrm'){const P=packS();if(window.confirm('ลบกระเป๋าใบนี้ออกจากรายการ?')){P.bags=P.bags.filter(x=>x.id!==b.dataset.id);Object.keys(P.mv).forEach(k=>{if(P.mv[k]===b.dataset.id)delete P.mv[k]});save();keepRoute()}}
  else if(a==='pkdef'){const P=packS();if(window.confirm('คืนค่าเริ่มต้นของกระเป๋าและผู้แบก?')){P.bags=pkDefBags();P.carriers=null;P.mv={};packS();save();keepRoute()}}
  else if(a==='pkmvclr'){packS().mv={};save();keepRoute()}
  else if(a==='pdf')pdfGo(b.dataset.w,b.dataset.i,b.dataset.id);
  else if(a==='print')printHTML(view.innerHTML);
  else if(a==='saveoff')saveOffline();
  else if(a==='lockagain'){localStorage.removeItem('hg_ok');sessionStorage.removeItem('hg_ok');location.reload()}
  else if(a==='wipe'){if(window.confirm('ล้างข้อมูลทะเบียน บัตรครอบครัว และการตั้งค่าในเครื่องนี้ทั้งหมด?')){localStorage.removeItem('hg_v1');localStorage.removeItem('hg_ph');PH={};S=defaults();applySettings();route()}}
});
document.addEventListener('change',e=>{if(e.target.dataset&&(e.target.dataset.stk||e.target.dataset.stkn||e.target.dataset.go||e.target.dataset.gob!==undefined||e.target.dataset.gop!==undefined))route();const d=e.target.dataset||{};if(d.pkmv!==undefined){const v=e.target.value;if(v==='__off'){const g=goS(),id=d.pkmv;if(/^x_/.test(id))g.x.splice(+id.slice(2),1);else{const it=GO_ITEMS.find(r=>r[0]===id);if(it&&(it[9]||'').split(/\s+/).includes('opt'))delete g.on[id];else g.off[id]=true}save()}else if(v){packS().mv[d.pkmv]=v;save()}keepRoute()}else if(d.pkwho!==undefined){const x=packS().bags.find(y=>y.id===d.pkwho);if(x){x.who=+e.target.value;save();keepRoute()}}else if(d.pkw!==undefined||(d.pkb!==undefined&&d.k!=='n')||(d.pkc!==undefined&&d.k!=='n'))keepRoute()});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.f){const id=t.dataset.id,f=t.dataset.f;let v=t.value;if(['qty','unit','iv'].includes(f))v=Math.max(0,+v||0);setInv(id,f,v)}
  else if(t.dataset.fam){S.fam[t.dataset.fam]=t.value;save()}
  else if(t.dataset.mem!==undefined){S.fam.members[+t.dataset.mem][t.dataset.k]=t.value;save()}
  else if(t.dataset.sh!==undefined){S.shelters[+t.dataset.sh][t.dataset.k]=t.value;save()}
  else if(t.dataset.pkw!==undefined){packS().w[t.dataset.pkw]=+t.value||0;save()}
  else if(t.dataset.pkb!==undefined){const x=packS().bags.find(y=>y.id===t.dataset.pkb);if(x){x[t.dataset.k]=t.dataset.k==='n'?t.value:(+t.value||0);save()}}
  else if(t.dataset.pkc!==undefined){const c=packS().carriers[+t.dataset.pkc];if(c){c[t.dataset.k]=t.dataset.k==='n'?t.value:(+t.value||0);save()}}
  else if(t.dataset.go){const g=goS();g[t.dataset.go]=+t.value;save()}
  else if(t.dataset.gob!==undefined){const g=goS();g.body[+t.dataset.gob]=+t.value;save()}
  else if(t.dataset.gop!==undefined){const g=goS();g.pct=g.pct||[25,25];g.pct[+t.dataset.gop]=+t.value;save()}
  else if(t.dataset.stk){S.stock.e[t.dataset.stk]=t.value;save()}
  else if(t.dataset.stkn){S.stock[t.dataset.stkn]=t.value;save()}
  else if(t.dataset.bag==='body'){S.bag.body=t.value;save()}
});
$('#btnTheme').onclick=()=>{const o=['auto','light','dark','night'],n={auto:'ตามเครื่อง',light:'สว่าง',dark:'มืด',night:'กลางคืน (แดง)'};S.settings.theme=o[(o.indexOf(S.settings.theme)+1)%4];save();applySettings();toast('โหมด: '+n[S.settings.theme])};
$('#btnFont').onclick=()=>{const o=[1,1.15,1.3,.9];S.settings.font=o[(o.indexOf(S.settings.font)+1)%4];save();applySettings()};
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;window.__dp=e;const b=$('#btnInstall');if(b)b.hidden=false});
document.addEventListener('click',e=>{if(e.target.id==='btnInstall'&&deferredPrompt){deferredPrompt.prompt();deferredPrompt=null;e.target.hidden=true}});
function netState(){const n=$('#net');n.className='st '+(navigator.onLine?'on':'off');n.textContent=navigator.onLine?'ออนไลน์':'ออฟไลน์'}
window.addEventListener('online',netState);window.addEventListener('offline',netState);
/* ---------- lock ---------- */
(function(){
  const ok=()=>{try{return localStorage.getItem('hg_ok')===String(PASS_HASH)||sessionStorage.getItem('hg_ok')===String(PASS_HASH)}catch(e){return false}};
  const start=()=>{applyProfile();$('#lock').hidden=true;$('#app').hidden=false;applySettings();netState();$('#verline').textContent='v'+APP_VER+' · '+APP_DATE;route()};
  if(ok()){start();return}
  applySettings();
  let buf='';const dots=$$('#dots i'),msg=$('#lockmsg');
  $('#pad').innerHTML=[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(k=>`<button data-k="${k}">${k}</button>`).join('');
  $('#pad').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k;msg.textContent='';
    if(k==='⌫')buf=buf.slice(0,-1);else if(k==='✓'){check()}else if(buf.length<4){buf+=k}
    dots.forEach((d,i)=>d.classList.toggle('on',i<buf.length));if(buf.length===4&&k!=='⌫'&&k!=='✓')check()});
  function check(){if(buf.length<4)return;if(cyrb('hg:'+buf)===PASS_HASH){try{($('#remember').checked?localStorage:sessionStorage).setItem('hg_ok',String(PASS_HASH))}catch(e){}start()}else{msg.textContent='รหัสไม่ถูกต้อง';$('#dots').classList.add('shake');setTimeout(()=>$('#dots').classList.remove('shake'),400);buf='';dots.forEach(d=>d.classList.remove('on'))}}
  document.addEventListener('keydown',e=>{if($('#lock').hidden)return;if(/^\d$/.test(e.key)&&buf.length<4){buf+=e.key;dots.forEach((d,i)=>d.classList.toggle('on',i<buf.length));if(buf.length===4)check()}else if(e.key==='Backspace'){buf=buf.slice(0,-1);dots.forEach((d,i)=>d.classList.toggle('on',i<buf.length))}});
})();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
